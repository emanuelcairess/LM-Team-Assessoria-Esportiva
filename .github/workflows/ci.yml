name: LM Team CI / CD & Security Suite

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java (Mandatory for Firebase Emulators)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck / Lint Codebase
        run: npm run lint

      - name: Unit & Integration Tests (HTTP & Logic)
        run: npm run test:unit

      - name: Execute Security Rules with Firestore Emulator
        run: npm run test:rules

      - name: Production Bundle Build
        run: npm run build
