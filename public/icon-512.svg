<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Ultra High-Fidelity Carbon Fiber Twill Weave Pattern (Diagonal Ribbed Texture) -->
    <pattern id="carbonDiagonal512" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#06070a" />
      <line x1="0" y1="0" x2="0" y2="16" stroke="#12151d" stroke-width="4" />
      <line x1="8" y1="0" x2="8" y2="16" stroke="#1c212c" stroke-width="4" />
      <line x1="4" y1="0" x2="4" y2="16" stroke="#0b0e14" stroke-width="2" opacity="0.8" />
      <line x1="12" y1="0" x2="12" y2="16" stroke="#252b39" stroke-width="2" opacity="0.5" />
    </pattern>

    <!-- Organic Tactile Carbon Rib Overlay -->
    <linearGradient id="carbonGleam512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2430" stop-opacity="0.6" />
      <stop offset="30%" stop-color="#090b10" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#040507" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#141822" stop-opacity="0.7" />
    </linearGradient>

    <!-- 3D Luxury Sculpted Gold Gradient (Master) -->
    <linearGradient id="gold3dMaster512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="12%" stop-color="#fff8db" />
      <stop offset="28%" stop-color="#fef08a" />
      <stop offset="48%" stop-color="#eab308" />
      <stop offset="68%" stop-color="#ca8a04" />
      <stop offset="88%" stop-color="#9a5b08" />
      <stop offset="100%" stop-color="#673905" />
    </linearGradient>

    <!-- 3D Light Gold Facet -->
    <linearGradient id="goldLightFacet512" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="40%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- 3D Deep Gold Shadow Extrusion -->
    <linearGradient id="goldDeepCarve512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#854d0e" />
      <stop offset="50%" stop-color="#542e07" />
      <stop offset="100%" stop-color="#1e0f02" />
    </linearGradient>

    <!-- Radial Lighting on Center -->
    <radialGradient id="lionBackdropGlow512" cx="50%" cy="36%" r="55%">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.2" />
      <stop offset="40%" stop-color="#ca8a04" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8" />
    </radialGradient>

    <!-- Outer Squircle Bezel Glow -->
    <linearGradient id="squircleBezel512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="25%" stop-color="#475569" stop-opacity="0.15" />
      <stop offset="70%" stop-color="#0f172a" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.2" />
    </linearGradient>

    <!-- Drop Shadows for 3D Relief -->
    <filter id="sculpture3dShadow512" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.95" />
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <filter id="typographyShadow512" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.9" />
    </filter>

    <!-- Liquid Glass Curved Specular Arc -->
    <linearGradient id="glassArc512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.38" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- SQUIRCLE BASE FRAME & TEXTURE -->
  <rect width="512" height="512" rx="118" fill="url(#carbonDiagonal512)" />
  <rect width="512" height="512" rx="118" fill="url(#carbonGleam512)" />
  <rect width="512" height="512" rx="118" fill="url(#lionBackdropGlow512)" />

  <!-- Outer Beveled Rim -->
  <rect x="5" y="5" width="502" height="502" rx="114" fill="none" stroke="url(#squircleBezel512)" stroke-width="3" />
  <rect x="10" y="10" width="492" height="492" rx="110" fill="none" stroke="#000000" stroke-width="3" opacity="0.8" />
  <rect x="14" y="14" width="484" height="484" rx="106" fill="none" stroke="url(#gold3dMaster512)" stroke-width="1.2" stroke-opacity="0.25" />

  <!-- SCULPTED 3D GOLDEN LION PROFILE -->
  <g filter="url(#sculpture3dShadow512)">
    <!-- Base 3D Cast Shadow Volume -->
    <path
      d="M256 68 C294 68 328 88 344 120 C358 104 378 98 396 104 C384 128 388 148 402 160 C420 148 440 156 446 176 C428 194 432 218 448 230 C430 248 424 272 418 296 C392 284 374 290 362 308 C340 274 304 262 278 262 C252 226 222 202 188 190 C206 166 214 144 206 118 C224 108 242 88 256 68 Z"
      fill="url(#goldDeepCarve512)"
      transform="translate(0, 4)"
    />

    <!-- Outer Mane Tufts and Flow -->
    <path
      d="M256 68 C294 68 328 88 344 120 C358 104 378 98 396 104 C384 128 388 148 402 160 C420 148 440 156 446 176 C428 194 432 218 448 230 C430 248 424 272 418 296 C392 284 374 290 362 308 C340 274 304 262 278 262 C252 226 222 202 188 190 C206 166 214 144 206 118 C224 108 242 88 256 68 Z"
      fill="url(#gold3dMaster512)"
    />

    <!-- Carved Inner Mane Strands -->
    <path
      d="M256 68 C226 104 214 146 196 186 C220 174 244 178 262 196 C244 156 262 116 292 90 Z"
      fill="url(#goldDeepCarve512)"
      opacity="0.9"
    />
    <path
      d="M256 68 C268 94 286 118 316 132 C298 108 280 88 256 68 Z"
      fill="url(#goldLightFacet512)"
    />

    <path
      d="M318 88 C306 122 318 152 348 170 C330 142 342 120 364 108 Z"
      fill="url(#goldLightFacet512)"
    />
    <path
      d="M344 120 C332 152 342 182 372 194 C354 172 366 148 384 142 Z"
      fill="url(#goldDeepCarve512)"
      opacity="0.8"
    />

    <path
      d="M370 160 C358 188 366 216 396 228 C380 208 388 186 406 180 Z"
      fill="url(#goldDeepCarve512)"
      opacity="0.75"
    />
    <path
      d="M388 202 C376 230 382 254 410 264 C396 246 402 226 418 222 Z"
      fill="url(#goldDeepCarve512)"
      opacity="0.7"
    />

    <path
      d="M262 196 C238 232 232 268 258 298 C252 264 266 236 286 220 Z"
      fill="url(#goldDeepCarve512)"
      opacity="0.85"
    />
    <path
      d="M286 220 C272 252 280 282 308 304 C296 276 306 250 326 236 Z"
      fill="url(#goldLightFacet512)"
    />
    <path
      d="M326 236 C314 266 322 292 348 308 C336 282 344 260 362 250 Z"
      fill="url(#goldDeepCarve512)"
      opacity="0.75"
    />

    <!-- Lion Face Profile -->
    <path
      d="M340 148 C366 148 396 160 414 178 C432 196 442 220 444 244 C426 238 412 244 402 256 C390 238 372 230 360 244 C346 220 334 188 340 148 Z"
      fill="url(#gold3dMaster512)"
    />
    <path
      d="M414 212 C438 214 450 228 450 244 C436 258 424 256 414 250 Z"
      fill="url(#goldLightFacet512)"
    />
    <path
      d="M408 242 C422 246 434 260 422 274 C408 266 402 256 408 242 Z"
      fill="url(#goldDeepCarve512)"
    />
    <path d="M424 250 L436 252 L428 258 Z" fill="#1a0d02" />

    <!-- Eye -->
    <path
      d="M378 174 C388 172 398 176 402 184 C392 186 382 182 378 174 Z"
      fill="#06070a"
    />
    <circle cx="392" cy="180" r="3" fill="#fef08a" />
    <path d="M372 168 C384 164 400 168 408 176" fill="none" stroke="#fffbeb" stroke-width="2.2" stroke-linecap="round" />

    <!-- Ear -->
    <path
      d="M318 132 C332 118 344 124 344 142 C330 144 322 140 318 132 Z"
      fill="url(#goldDeepCarve512)"
    />
    <path d="M326 128 C334 124 340 130 340 138" fill="none" stroke="#fef08a" stroke-width="1.8" />
  </g>

  <!-- 3. TYPOGRAPHY -->
  <g filter="url(#typographyShadow512)">
    <text
      x="170"
      y="384"
      text-anchor="middle"
      font-family="system-ui, -apple-system, 'SF Pro Display', Montserrat, 'Segoe UI', sans-serif"
      font-weight="900"
      font-size="64"
      letter-spacing="5"
      fill="url(#goldDeepCarve512)"
    >TEAM</text>
    <text
      x="366"
      y="384"
      text-anchor="middle"
      font-family="system-ui, -apple-system, 'SF Pro Display', Montserrat, 'Segoe UI', sans-serif"
      font-weight="900"
      font-style="italic"
      font-size="70"
      letter-spacing="4"
      fill="url(#goldDeepCarve512)"
    >LM</text>

    <text
      x="170"
      y="380"
      text-anchor="middle"
      font-family="system-ui, -apple-system, 'SF Pro Display', Montserrat, 'Segoe UI', sans-serif"
      font-weight="900"
      font-size="64"
      letter-spacing="5"
      fill="url(#gold3dMaster512)"
    >TEAM</text>
    <text
      x="366"
      y="380"
      text-anchor="middle"
      font-family="system-ui, -apple-system, 'SF Pro Display', Montserrat, 'Segoe UI', sans-serif"
      font-weight="900"
      font-style="italic"
      font-size="70"
      letter-spacing="4"
      fill="url(#gold3dMaster512)"
    >LM</text>

    <text
      x="256"
      y="432"
      text-anchor="middle"
      font-family="system-ui, -apple-system, 'SF Pro Display', Montserrat, 'Segoe UI', sans-serif"
      font-weight="800"
      font-size="34"
      letter-spacing="9"
      fill="url(#goldDeepCarve512)"
    >CONSULTORIA</text>
    <text
      x="256"
      y="429"
      text-anchor="middle"
      font-family="system-ui, -apple-system, 'SF Pro Display', Montserrat, 'Segoe UI', sans-serif"
      font-weight="800"
      font-size="34"
      letter-spacing="9"
      fill="url(#gold3dMaster512)"
    >CONSULTORIA</text>
  </g>

  <!-- 4. SPECULAR ARC -->
  <path
    d="M18 18 C170 18 360 55 450 170 C350 130 170 100 18 260 Z"
    fill="url(#glassArc512)"
    pointer-events="none"
  />
</svg>
